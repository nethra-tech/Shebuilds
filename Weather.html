<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(145deg, #c9e9ff, #eef7ff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: background 0.3s, color 0.3s;
    }

    body.dark {
      background: #1a1e24;
      color: #f0f3f8;
    }

    .dashboard {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 28px 24px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 35px rgba(0, 40, 80, 0.15);
    }

    body.dark .dashboard {
      background: rgba(30, 36, 48, 0.95);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.6rem;
      color: #10456b;
    }

    body.dark .header h1 { color: #b1d9ff; }

    .theme-toggle {
      background: white;
      border: 1px solid #cddae9;
      border-radius: 40px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    body.dark .theme-toggle {
      background: #2b3648;
      color: #ecf3ff;
      border-color: #4b5a70;
    }

    /* ---------- SEARCH BAR ---------- */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 40px;
      border: 1px solid #cddae9;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    .search-bar input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }

    body.dark .search-bar input {
      background: #2b3648;
      color: white;
      border-color: #4b5a70;
    }

    .search-bar button {
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 12px 22px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-bar button:hover { background: #0d5eb0; }
    .search-bar button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ---------- ERROR & LOADING MESSAGES ---------- */
    .message {
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      display: none;
    }

    .message.show { display: block; }

    .message.error {
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ffcdd2;
    }

    body.dark .message.error {
      background: #4a1c1c;
      color: #ffbdbd;
      border-color: #7a2d2d;
    }

    .message.info {
      background: #e3f2fd;
      color: #0d47a1;
      border: 1px solid #bbdefb;
    }

    body.dark .message.info {
      background: #1a3450;
      color: #b3d9ff;
      border-color: #2c4e70;
    }

    /* ---------- WEATHER DISPLAY ---------- */
    .weather-card { display: none; }
    .weather-card.show { display: block; }

    .weather-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.5);
      padding: 18px 22px;
      border-radius: 28px;
      margin-bottom: 16px;
    }

    body.dark .weather-main {
      background: rgba(20, 26, 36, 0.7);
    }

    .temp {
      font-size: 3.2rem;
      font-weight: 300;
      color: #003057;
      line-height: 1;
    }

    body.dark .temp { color: #e0efff; }

    .unit { font-size: 1.4rem; color: #3a5f7a; }
    body.dark .unit { color: #9bb8da; }

    .condition {
      text-align: right;
    }

    .condition .icon { font-size: 2.4rem; }
    .condition .text { font-size: 1rem; font-weight: 500; color: #1f4b6e; }
    body.dark .condition .text { color: #c6dfff; }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .detail-card {
      background: rgba(255, 255, 255, 0.6);
      padding: 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    body.dark .detail-card {
      background: rgba(40, 48, 62, 0.85);
      border-color: #3e4c60;
    }

    .detail-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: #4c6f8c;
      margin-bottom: 4px;
    }

    body.dark .detail-label { color: #9bb5d0; }

    .detail-value {
      font-size: 1.3rem;
      font-weight: 500;
      color: #0a2a3f;
    }

    body.dark .detail-value { color: #e7f0ff; }

    .location {
      text-align: center;
      margin-top: 14px;
      font-size: 1.05rem;
      color: #10456b;
      font-weight: 500;
    }

    body.dark .location { color: #bbd8ff; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>🌤️ Weather Dashboard</h1>
      <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-bar">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter city (e.g. London)"
        autocomplete="off"
      />
      <button id="searchBtn">Search</button>
    </div>

    <!-- MESSAGES -->
    <div class="message error" id="errorMsg"></div>
    <div class="message info" id="infoMsg"></div>

    <!-- WEATHER RESULT -->
    <div class="weather-card" id="weatherCard">
      <div class="weather-main">
        <div>
          <span class="temp" id="temp">--</span>
          <span class="unit">°C</span>
        </div>
        <div class="condition">
          <div class="icon" id="conditionIcon">☀️</div>
          <div class="text" id="conditionText">--</div>
        </div>
      </div>

      <div class="details-grid">
        <div class="detail-card">
          <div class="detail-label">💧 Humidity</div>
          <div class="detail-value" id="humidity">--%</div>
        </div>
        <div class="detail-card">
          <div class="detail-label">🌬️ Wind</div>
          <div class="detail-value" id="wind">-- km/h</div>
        </div>
        <div class="detail-card">
          <div class="detail-label">🌡️ Feels Like</div>
          <div class="detail-value" id="feelsLike">--°C</div>
        </div>
        <div class="detail-card">
          <div class="detail-label">☁️ Pressure</div>
          <div class="detail-value" id="pressure">-- hPa</div>
        </div>
      </div>

      <div class="location" id="location">📍 --</div>
    </div>
  </div>

  <script>
    /* =========================================================
       DOM ELEMENTS
    ========================================================= */
    const cityInput   = document.getElementById('cityInput');
    const searchBtn   = document.getElementById('searchBtn');
    const weatherCard = document.getElementById('weatherCard');
    const errorMsg    = document.getElementById('errorMsg');
    const infoMsg     = document.getElementById('infoMsg');

    const tempEl        = document.getElementById('temp');
    const conditionIcon = document.getElementById('conditionIcon');
    const conditionText = document.getElementById('conditionText');
    const humidityEl    = document.getElementById('humidity');
    const windEl        = document.getElementById('wind');
    const feelsLikeEl   = document.getElementById('feelsLike');
    const pressureEl    = document.getElementById('pressure');
    const locationEl    = document.getElementById('location');

    /* =========================================================
       WEATHER CODE → ICON + DESCRIPTION MAPPING
       (WMO weather interpretation codes used by Open-Meteo)
    ========================================================= */
    const weatherCodes = {
      0:  { icon: '☀️', text: 'Clear sky' },
      1:  { icon: '🌤️', text: 'Mainly clear' },
      2:  { icon: '⛅', text: 'Partly cloudy' },
      3:  { icon: '☁️', text: 'Overcast' },
      45: { icon: '🌫️', text: 'Fog' },
      48: { icon: '🌫️', text: 'Depositing rime fog' },
      51: { icon: '🌦️', text: 'Light drizzle' },
      53: { icon: '🌦️', text: 'Moderate drizzle' },
      55: { icon: '🌧️', text: 'Dense drizzle' },
      61: { icon: '🌧️', text: 'Slight rain' },
      63: { icon: '🌧️', text: 'Moderate rain' },
      65: { icon: '🌧️', text: 'Heavy rain' },
      71: { icon: '🌨️', text: 'Slight snow' },
      73: { icon: '🌨️', text: 'Moderate snow' },
      75: { icon: '❄️', text: 'Heavy snow' },
      80: { icon: '🌦️', text: 'Rain showers' },
      81: { icon: '🌧️', text: 'Heavy showers' },
      82: { icon: '⛈️', text: 'Violent showers' },
      95: { icon: '⛈️', text: 'Thunderstorm' },
      96: { icon: '⛈️', text: 'Thunderstorm + hail' },
      99: { icon: '⛈️', text: 'Severe thunderstorm' },
    };

    /* =========================================================
       HELPER: Show / Hide messages
    ========================================================= */
    function showError(message) {
      errorMsg.textContent = '❌ ' + message;
      errorMsg.classList.add('show');
      infoMsg.classList.remove('show');
      weatherCard.classList.remove('show');
    }

    function showInfo(message) {
      infoMsg.textContent = 'ℹ️ ' + message;
      infoMsg.classList.add('show');
      errorMsg.classList.remove('show');
    }

    function hideMessages() {
      errorMsg.classList.remove('show');
      infoMsg.classList.remove('show');
    }

    /* =========================================================
       MAIN FUNCTION: Get coordinates from city name
       Uses Open-Meteo Geocoding API (free, no key)
    ========================================================= */
    async function getCoordinates(city) {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;

      const response = await fetch(url);
      if (!response.ok) {
        throw new Error('Geocoding service unavailable. Please try again later.');
      }

      const data = await response.json();

      // No results → invalid city
      if (!data.results || data.results.length === 0) {
        throw new Error(`City "${city}" not found. Please check the spelling.`);
      }

      const place = data.results[0];
      return {
        name: place.name,
        country: place.country,
        latitude: place.latitude,
        longitude: place.longitude,
      };
    }

    /* =========================================================
       MAIN FUNCTION: Get current weather by coordinates
    ========================================================= */
    async function getWeather(lat, lon) {
      const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,` +
        `surface_pressure,wind_speed_10m,weather_code`;

      const response = await fetch(url);
      if (!response.ok) {
        throw new Error('Weather service unavailable. Please try again later.');
      }

      const data = await response.json();

      if (!data.current) {
        throw new Error('Could not read weather data.');
      }

      return data.current;
    }

    /* =========================================================
       UPDATE THE UI with weather data
    ========================================================= */
    function updateUI(location, weather) {
      // Temperature
      tempEl.textContent = Math.round(weather.temperature_2m);

      // Weather condition
      const codeInfo = weatherCodes[weather.weather_code] || {
        icon: '❓',
        text: 'Unknown',
      };
      conditionIcon.textContent = codeInfo.icon;
      conditionText.textContent = codeInfo.text;

      // Details
      humidityEl.textContent  = weather.relative_humidity_2m + '%';
      windEl.textContent      = Math.round(weather.wind_speed_10m) + ' km/h';
      feelsLikeEl.textContent = Math.round(weather.apparent_temperature) + '°C';
      pressureEl.textContent  = Math.round(weather.surface_pressure) + ' hPa';

      // Location
      locationEl.textContent = `📍 ${location.name}, ${location.country}`;

      // Show card
      weatherCard.classList.add('show');
    }

    /* =========================================================
       MAIN SEARCH HANDLER (async — ties everything together)
    ========================================================= */
    async function searchCity() {
      const city = cityInput.value.trim();

      // ---- INPUT VALIDATION ----
      if (!city) {
        showError('Please enter a city name.');
        return;
      }

      if (city.length < 2) {
        showError('City name must be at least 2 characters.');
        return;
      }

      // Simple regex: allow letters, spaces, hyphens, apostrophes
      if (!/^[a-zA-Z\s\-']+$/.test(city)) {
        showError('City name should only contain letters, spaces, hyphens or apostrophes.');
        return;
      }

      // ---- LOADING STATE ----
      hideMessages();
      showInfo('Loading weather data...');
      searchBtn.disabled = true;
      searchBtn.textContent = 'Loading...';

      try {
        // Step 1: city → coordinates
        const location = await getCoordinates(city);

        // Step 2: coordinates → weather
        const weather = await getWeather(location.latitude, location.longitude);

        // Step 3: update the UI
        hideMessages();
        updateUI(location, weather);

      } catch (error) {
        // ---- ERROR HANDLING ----
        // Handles network errors AND our custom thrown errors
        console.error('Weather fetch failed:', error);
        showError(error.message || 'Something went wrong. Please try again.');
      } finally {
        // Always restore the button state
        searchBtn.disabled = false;
        searchBtn.textContent = 'Search';
      }
    }

    /* =========================================================
       EVENT LISTENERS
    ========================================================= */
    searchBtn.addEventListener('click', searchCity);

    // Allow pressing Enter in the input field
    cityInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchCity();
    });

    /* =========================================================
       DARK MODE TOGGLE (with localStorage persistence)
    ========================================================= */
    const themeToggle = document.getElementById('themeToggle');

    if (localStorage.getItem('weatherTheme') === 'dark') {
      document.body.classList.add('dark');
      themeToggle.textContent = '☀️ Light';
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeToggle.textContent = isDark ? '☀️ Light' : '🌙 Dark';
      localStorage.setItem('weatherTheme', isDark ? 'dark' : 'light');
    });

    /* =========================================================
       AUTO-LOAD a default city on first visit
    ========================================================= */
    window.addEventListener('load', () => {
      cityInput.value = 'Mumbai';
      searchCity();
    });
  </script>
</body>
</html>
